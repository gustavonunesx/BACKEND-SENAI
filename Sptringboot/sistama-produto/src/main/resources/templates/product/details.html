<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title" th:text="${product.name}"></h1>
                <p class="card-text" th:text="${product.description}"></p>
                <p class="card-text"><strong>Preço:</strong> <span th:text="${'R$ ' + #numbers.formatDecimal(product.price, 1, 2)}"></span></p>
                <p class="card-text"><strong>Estoque:</strong> <span th:text="${product.quantity}"></span></p>
                <a th:href="@{/products}" class="btn btn-secondary">Voltar</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
