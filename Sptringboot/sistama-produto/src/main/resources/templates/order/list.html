<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Pedidos</h1>
            <a th:href="@{/orders/new}" class="btn btn-primary">Novo Pedido</a>
        </div>

        <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
            Nenhum pedido cadastrado.
        </div>

        <table class="table table-striped table-hover" th:unless="${#lists.isEmpty(orders)}">
            <thead class="table-dark">
                <tr>
                    <th>Cliente</th>
                    <th>Produtos</th>
                    <th>Valor total</th>
                    <th>Data/hora</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.client.fullName}"></td>
                    <td>
                        <ul class="list-unstyled mb-0">
                            <li th:each="item : ${order.items}"
                                th:text="${item.product.name + ' x ' + item.quantity}"></li>
                        </ul>
                    </td>
                    <td th:text="${'R$ ' + #numbers.formatDecimal(order.totalValue, 1, 2)}"></td>
                    <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <span th:if="${order.status.name() == 'ATIVO'}" class="badge bg-success">Ativo</span>
                        <span th:if="${order.status.name() == 'CANCELADO'}" class="badge bg-secondary">Cancelado</span>
                    </td>
                    <td>
                        <a th:if="${order.status.name() == 'ATIVO'}"
                           th:href="@{/orders/edit/{id}(id=${order.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:if="${order.status.name() == 'ATIVO'}"
                           th:href="@{/orders/cancel/{id}(id=${order.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Tem certeza que deseja cancelar este pedido? O estoque será devolvido.');">Cancelar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
