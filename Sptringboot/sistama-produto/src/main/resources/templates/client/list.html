<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Clientes</h1>
            <a th:href="@{/clients/new}" class="btn btn-primary">Novo Cliente</a>
        </div>

        <div th:if="${#lists.isEmpty(clients)}" class="alert alert-info">
            Nenhum cliente cadastrado.
        </div>

        <table class="table table-striped table-hover" th:unless="${#lists.isEmpty(clients)}">
            <thead class="table-dark">
                <tr>
                    <th>Nome completo</th>
                    <th>E-mail</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>Endereço</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="client : ${clients}">
                    <td th:text="${client.fullName}"></td>
                    <td th:text="${client.email}"></td>
                    <td th:text="${client.cpf}"></td>
                    <td th:text="${client.phone}"></td>
                    <td th:text="${client.address.street + ', ' + client.address.number + ' - ' + client.address.neighborhood + ', ' + client.address.city + '/' + client.address.state + ' - ' + client.address.zipCode}"></td>
                    <td>
                        <a th:href="@{/clients/edit/{id}(id=${client.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/clients/delete/{id}(id=${client.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Tem certeza que deseja excluir este cliente?');">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
