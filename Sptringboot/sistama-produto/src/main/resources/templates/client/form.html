<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${client.id == null} ? 'Novo Cliente' : 'Editar Cliente'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container">
        <h1 th:text="${client.id == null} ? 'Novo Cliente' : 'Editar Cliente'"></h1>

        <form th:action="${client.id == null} ? @{/clients/save} : @{/clients/update/{id}(id=${client.id})}"
              th:object="${client}" method="post" class="mt-3">

            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="fullName" class="form-label">Nome completo</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="cpf" class="form-label">CPF</label>
                    <input type="text" id="cpf" th:field="*{cpf}" class="form-control" placeholder="000.000.000-00"
                           th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'" />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="phone" class="form-label">Telefone</label>
                    <input type="text" id="phone" th:field="*{phone}" class="form-control"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
            </div>

            <h5 class="mt-4">Endereço</h5>
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label for="street" class="form-label">Logradouro</label>
                    <input type="text" id="street" th:field="*{address.street}" class="form-control"
                           th:classappend="${#fields.hasErrors('address.street')} ? 'is-invalid'" />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('address.street')}" th:errors="*{address.street}"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="number" class="form-label">Número</label>
                    <input type="text" id="number" th:field="*{address.number}" class="form-control" />
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="complement" class="form-label">Complemento</label>
                    <input type="text" id="complement" th:field="*{address.complement}" class="form-control" />
                </div>
                <div class="col-md-6 mb-3">
                    <label for="neighborhood" class="form-label">Bairro</label>
                    <input type="text" id="neighborhood" th:field="*{address.neighborhood}" class="form-control"
                           th:classappend="${#fields.hasErrors('address.neighborhood')} ? 'is-invalid'" />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('address.neighborhood')}" th:errors="*{address.neighborhood}"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="city" class="form-label">Cidade</label>
                    <input type="text" id="city" th:field="*{address.city}" class="form-control"
                           th:classappend="${#fields.hasErrors('address.city')} ? 'is-invalid'" />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('address.city')}" th:errors="*{address.city}"></div>
                </div>
                <div class="col-md-2 mb-3">
                    <label for="state" class="form-label">UF</label>
                    <input type="text" id="state" th:field="*{address.state}" class="form-control" maxlength="2"
                           th:classappend="${#fields.hasErrors('address.state')} ? 'is-invalid'" />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('address.state')}" th:errors="*{address.state}"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="zipCode" class="form-label">CEP</label>
                    <input type="text" id="zipCode" th:field="*{address.zipCode}" class="form-control" placeholder="00000-000"
                           th:classappend="${#fields.hasErrors('address.zipCode')} ? 'is-invalid'" />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('address.zipCode')}" th:errors="*{address.zipCode}"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/clients}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
