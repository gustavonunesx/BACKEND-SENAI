<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${aluno.id} != null ? 'Editar Aluno' : 'Novo Aluno'">Formulário de Aluno</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        h1 { color: #333; }
        form { background-color: #fff; padding: 20px; max-width: 420px; border-radius: 4px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        .error { color: #dc3545; font-size: 0.9em; }
        button { margin-top: 20px; padding: 10px 16px; background-color: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        a.cancel { display: inline-block; margin-top: 20px; margin-left: 10px; color: #555; text-decoration: none; }
    </style>
</head>
<body>
    <h1 th:text="${aluno.id} != null ? 'Editar Aluno' : 'Novo Aluno'">Formulário de Aluno</h1>

    <form th:action="@{/alunos/save}" th:object="${aluno}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}" />
        <span class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>

        <label for="email">E-mail</label>
        <input type="email" id="email" th:field="*{email}" />
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento" th:field="*{dataNascimento}" />
        <span class="error" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></span>

        <label for="curso">Curso</label>
        <input type="text" id="curso" th:field="*{curso}" />
        <span class="error" th:if="${#fields.hasErrors('curso')}" th:errors="*{curso}"></span>

        <button type="submit">Salvar</button>
        <a class="cancel" th:href="@{/alunos}">Cancelar</a>
    </form>
</body>
</html>
