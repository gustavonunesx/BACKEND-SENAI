<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; background-color: #fff; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #333; color: #fff; }
        a.button { display: inline-block; padding: 8px 12px; margin-bottom: 15px; background-color: #28a745; color: #fff; text-decoration: none; border-radius: 4px; }
        a.edit { color: #007bff; margin-right: 10px; }
        a.delete { color: #dc3545; }
        .empty { color: #777; }
    </style>
</head>
<body>
    <h1>Lista de Alunos</h1>

    <a class="button" th:href="@{/alunos/new}">Novo Aluno</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Data de Nascimento</th>
                <th>Curso</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="aluno : ${alunos}">
                <td th:text="${aluno.id}">1</td>
                <td th:text="${aluno.nome}">Nome</td>
                <td th:text="${aluno.email}">email@exemplo.com</td>
                <td th:text="${aluno.dataNascimento}">2000-01-01</td>
                <td th:text="${aluno.curso}">Curso</td>
                <td>
                    <a class="edit" th:href="@{/alunos/edit/{id}(id=${aluno.id})}">Editar</a>
                    <a class="delete" th:href="@{/alunos/delete/{id}(id=${aluno.id})}"
                       onclick="return confirm('Deseja realmente excluir este aluno?');">Excluir</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(alunos)}">
                <td colspan="6" class="empty">Nenhum aluno cadastrado.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
